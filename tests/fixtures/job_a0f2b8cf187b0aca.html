<html><head><link href="https://www.ziprecruiter.com/c/Raytheon/Job/Software-Engineer-I/-in-Austin,TX?jid=a0f2b8cf187b0aca" rel="canonical"/></head><body><script>self.__next_f.push([1,"29:T218c,<p><b>Date Posted:</b></p>2026-09-25\n<p><b>Country:</b></p>United States of America \n<p><b>Location:</b></p>US-AZ-TUCSON-805 ~ 1151 E Hermans Rd ~ BLDG 805 \n<p><b>Position Role Type:</b></p>Onsite \n<p><b>U.S. Citizen, U.S. Person, or Immigration Status Requirements: </b></p>Active and transferable U.S. government issued security clearance is required prior to start date.\u200b U.S. citizenship is required, as only U.S. citizens are eligible for a security clearance\u200b \n<p><b>Security Clearance Type: </b></p>DoD Clearance: Secret \n<p><b>Security Clearance Status: </b></p>Ability to obtain INTERIM U.S. government issued security clearance is required prior to start date\n<p></p>\n<p></p>\n<p>Are you ready to explore the world of aerospace and defense? Do you want to learn from and collaborate with some of the greatest minds in the industry? At RTX, our internships, co-ops and full-time careers provide an exceptional foundation to work on complex problems, advance your skills and create a safer, more connected world. Discover opportunities to make a difference at RTX.</p>\n<p></p>\n<p><b>What You Will Do</b></p>\n<p></p>\n<p>The Software organization develops software applications, including integration and test on missiles, launchers, radars, naval systems, fire control and other complex systems. \u202fOur precision software and firmware integrate operating systems, device drivers, networking, and control software to bring together sensors, guidance, and flight control processing features to complete the mission. \u202fThe Software org is made up of several Centers located across the country, responsible for all aspects of the software development lifecycle. \u202fOur 4000+ software engineers design, develop, and build innovative solutions for our customers.\u202f&nbsp;Join our fast-paced agile teams on the leading edge of technology.</p>\n<p></p>\n<p>As part of the Software Engineering Directorate\u2019s Effectors Center team, you will be an integral part of helping Raytheon further our vision to be the global leader in core and next-generation weapon and security solutions.\u202f&nbsp;By any measure, Raytheon is an exciting and rewarding place to work. \u202fWe pride ourselves on developing mission-driven, world-class talent. \u202fThe result is a workforce that takes pride in the company and consistently delivers superior solutions. Our engineers design, develop, and build innovative solutions for the U.S. Government.\u202f&nbsp;Experience all aspects of a software development life cycle as a member of a fast-paced agile team on the leading edge of:\u202f<br>\n &nbsp;</p>\n<ul>\n <li>Real-time systems design</li>\n <li>Digital signal processing</li>\n <li>Machine Learning and Autonomous Systems</li>\n <li>Cyber Security</li>\n <li>DevOps technologies and methods</li>\n</ul>\n<p></p>\n<p>We encourage curious, creative problem solvers to join our team of bright, dedicated software craftspeople in designing and implementing highly innovative systems. \u202fYou will learn advanced software engineering practices and apply new technologies to develop next generation capabilities and help keep our country safe.\u202f</p>\n<p></p>\n<p>This position is within the Effectors Center of the Software organization, and is an onsite role located in Tucson, AZ.</p>\n<ul>\n <li>Assist and participate in the requirements, design, development and testing of real-time embedded software, application software, and tools, to include development of new work products or enhancement of existing applications and systems.</li>\n <li>Design, code, test, integrate, and document software solutions.</li>\n <li>Participate in internal review of software components and systems.</li>\n <li>Collaborate with project managers and other professionals within Engineering.</li>\n <li>Work on problems with defined scope, schedule, and expectations.</li>\n <li>Follow established development practices and processes to maintain the configuration management of software products.</li>\n</ul>\n<p></p>\n<p><b>What You Will Learn</b></p>\n<ul>\n <li>Use new tools that will keep you state-of-the-art.</li>\n <li>Stay updated with the latest advancements in software development and missile technology to drive innovation.</li>\n</ul>\n<p></p>\n<p><b>Qualifications You Must Have</b></p>\n<ul>\n <li>Bachelor\u2019s degree in Software Engineering, Computer Engineering, Computer Science, or related Science, Technology, Engineering or Mathematics (STEM) major obtained by start date</li>\n <li>Experience with C, C++, or other object-oriented language</li>\n <li>Experience with hardware-software integration and embedded system testing</li>\n</ul>\n<p><br><i>Experience may be obtained through on-the-job experience, research, coursework, or projects</i></p>\n<p></p>\n<p><b>Qualifications We Prefer</b></p>\n<ul>\n <li>Prior Internship experience</li>\n <li>Experience with Real-Time Operating Systems (RTOS)</li>\n <li>Knowledge of object-oriented design and Unified Model Language</li>\n <li>Experience writing low level code for microcontroller, Arduino or Raspberry PI</li>\n <li>Interpersonal and communication skills, both verbal and written</li>\n <li>ABET accreditation</li>\n <li>Minimum 3.0 GPA</li>\n <li>Demonstrated ability to work effectively with colleagues and leaders in a team environment</li>\n</ul>\n<p></p>\n<p><b>What We Offer</b></p>\n<ul>\n <li>Our values drive our actions, behaviors, and performance with a vision for a safer, more connected world. At RTX, we value: Safety, Trust, Respect, Accountability, Collaboration, and Innovation.</li>\n <li>Relocation, if eligible</li>\n</ul>\n<p></p>\n<p><b>Learn More &amp; Apply Now!</b></p>\n<p>Please consider the following role type definition as you apply for this role.</p>\n<ul>\n <li>Onsite: Employees who are working in onsite roles will work primarily onsite. This includes all production and maintenance employees, as they are essential to the development of our products.</li>\n</ul>\n<p></p>\n<p></p>\n<p></p>\n<p><i><b>As part of our commitment to maintaining a secure hiring process, candidates may be asked to attend&nbsp;select steps of the interview process in-person at one of our office locations, regardless of whether the role is designated as on-site, hybrid or remote.</b></i></p>\n<p></p>The salary range for this role is 57,200 USD - 108,800 USD. The salary range provided is a good faith estimate representative of all experience levels. RTX considers several factors when extending an offer, including but not limited to, the role, function and associated responsibilities, a candidate\u2019s work experience, location, education/training, and key skills.\n<p></p>\n<p></p>\n<p></p>Hired applicants may be eligible for benefits, including but not limited to, medical, dental, vision, life insurance, short-term disability, long-term disability, 401(k) match, flexible spending accounts, flexible work schedules, employee assistance program, Employee Scholar Program, parental leave, paid time off, and holidays. Specific benefits are dependent upon the specific business unit as well as whether or not the position is covered by a collective-bargaining agreement.\n<p></p>\n<p></p>Hired applicants may be eligible for annual short-term and/or long-term incentive compensation programs depending on the level of the position and whether or not it is covered by a collective-bargaining agreement. Payments under these annual programs are not guaranteed and are dependent upon a variety of factors including, but not limited to, individual performance, business unit performance, and/or the company\u2019s performance.\n<p></p>\n<p></p>This role is a U.S.-based role. If the successful candidate resides in a U.S. territory, the appropriate pay structure and benefits will apply.\n<p></p>\n<p></p>RTX anticipates the application window closing approximately 40 days from the date the notice was posted. However, factors such as candidate flow and business necessity may require RTX to shorten or extend the application window.\n<p></p>\n<p></p>\n<p><i>RTX is an Equal Opportunity Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability or veteran status, or any other applicable state or federal protected class. RTX provides affirmative action in employment for qualified Indiv"])</script><script>self.__next_f.push([1,"iduals with a Disability and Protected Veterans in compliance with Section 503 of the Rehabilitation Act and the Vietnam Era Veterans\u2019 Readjustment Assistance Act.</i></p>\n<p></p>\n<p></p>\n<p><b>Privacy Policy and Terms:</b></p>\n<p>Click on this link to read the Policy and Terms</p>2a:[\"$\",\"$L40\",null,{\"serializedJobDetails\":{\"jobDetails\":{\"listingKey\":\"VCvoeOxPeJIubgrJa2Cuvw\",\"title\":\"Software Engineer I (Onsite)\",\"status\":{\"isActive\":true,\"postedAtUtc\":\"2026-08-14T04:13:54Z\",\"rollingPostedAtUtc\":\"2026-10-13T04:13:54Z\"},\"pay\":{\"metadata\":{\"sourceType\":\"SOURCE_MISSING\"},\"interval\":\"PAY_INTERVAL_YEAR\",\"currency\":\"PAY_CURRENCY_USD\",\"max\":171500,\"min\":118900,\"maxAnnual\":171500,\"minAnnual\":118900},\"benefits\":[{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"name\":\"BENEFIT_TYPE_NAME_MEDICAL\"},{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"name\":\"BENEFIT_TYPE_NAME_VISION\"},{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"name\":\"BENEFIT_TYPE_NAME_DENTAL\"},{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"name\":\"BENEFIT_TYPE_NAME_PAID_TIME_OFF\"},{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"name\":\"BENEFIT_TYPE_NAME_LIFE_INSURANCE\"},
