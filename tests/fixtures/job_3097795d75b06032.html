li><li>Operate within the guidelines of the Nurse Practice Act and relevant administrative rules.</li></ul>Qualifications <ul><li>Graduation from an accredited nursing program is required, such as those recognized by the American Association of Colleges of Nursing (AACN), Accreditation Commission for Education in Nursing (ACEN), or National League for Nursing Commission for Nursing Education Accreditation (NLN CNEA).</li><li>A Bachelor&rsquo;s Degree in nursing is preferred.</li><li>Must hold an unencumbered RN license from the State Board of Nursing in the practice area, or possess multistate licensure if applicable.</li><li>Must obtain and maintain necessary department-specific competencies and certifications.</li></ul>Benefits <p>We offer a competitive benefits package for eligible full-time and part-time employees, which may include:</p><ul><li>Health, dental, and vision insurance.</li><li>Life insurance and a 401(k) retirement plan.</li><li>Work/life balance initiatives and a generous time-off policy to support a healthy work-life integration.</li></ul><p>We are an equal opportunity employer and welcome applicants from all backgrounds. If you require assistance with your application due to a disability, please reach out for support.</p><p>Our organization maintains a Drug-Free Workplace Policy. A successful job offer will be contingent upon passing a drug screening and background check.</p><p><b>Job Function:</b> Nursing</p><p><b>Req Number:</b> R-</p><p><b>Featured:</b> No</p></div>2a:[\"$\",\"$L40\",null,{\"serializedJobDetails\":{\"jobDetails\":{\"listingKey\":\"pI96YSMptcqeAhkdfkXIYw\",\"title\":\"RN Traveler - Med Surge/OB\",\"status\":{\"isActive\":true,\"postedAtUtc\":\"2026-10-03T14:26:32Z\",\"rollingPostedAtUtc\":\"2026-10-03T14:26:32Z\"},\"pay\":{\"metadata\":{\"sourceType\":\"SOURCE_PARSED\",\"visible\":true},\"interval\":\"PAY_INTERVAL_WEEK\",\"currency\":\"PAY_CURRENCY_USD\",\"max\":3010,\"min\":3010,\"maxAnnual\":150500,\"minAnnual\":150500},\"ben
